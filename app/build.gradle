plugins {
    id 'com.android.application'
}

def stableStoreFile = providers.gradleProperty('MOBILEHORIZON_STORE_FILE').getOrElse('')
def stableStorePassword = providers.gradleProperty('MOBILEHORIZON_STORE_PASSWORD').getOrElse('')
def stableKeyAlias = providers.gradleProperty('MOBILEHORIZON_KEY_ALIAS').getOrElse('')
def stableKeyPassword = providers.gradleProperty('MOBILEHORIZON_KEY_PASSWORD').getOrElse('')
def hasStableSigning = !stableStoreFile.isEmpty() && !stableStorePassword.isEmpty()
        && !stableKeyAlias.isEmpty() && !stableKeyPassword.isEmpty()

def horizonPcReleaseTag = providers.gradleProperty('HORIZON_PC_RELEASE_TAG').getOrElse('v0.2.50')
def horizonTestOldReleaseTag = providers.gradleProperty('HORIZON_TEST_OLD_RELEASE_TAG').getOrElse('v0.2.49')

// The native launcher ports the Horizon desktop design system. Fonts and their licenses are
// fetched from a pinned upstream source revision and packaged as app assets (never as a fixed runtime).
def horizonUiAssetsDir = layout.buildDirectory.dir('generated/horizon-ui-assets')
def horizonUiUpstreamCommit = 'd58d26c793bf87c0961589c027a45613273d5ad4'
def horizonUiAssetNames = [
        'Geist-Regular.ttf', 'Geist-Medium.ttf', 'Geist-SemiBold.ttf', 'GeistMono-Regular.ttf',
        'PixelifySans-Medium.ttf', 'PixelifySans-SemiBold.ttf', 'PixelifySans-Bold.ttf',
        'OFL-Geist.txt', 'OFL-PixelifySans.txt'
]

def downloadHorizonUiAssets = tasks.register('downloadHorizonUiAssets') {
    outputs.dir(horizonUiAssetsDir)
    doLast {
        File outputDir = new File(horizonUiAssetsDir.get().asFile, 'horizon-ui')
        if (!outputDir.isDirectory() && !outputDir.mkdirs()) {
            throw new GradleException("Unable to create Horizon UI asset directory: ${outputDir}")
        }
        String baseUrl = "https://raw.githubusercontent.com/ludovic111/horizon/${horizonUiUpstreamCommit}/crates/horizon-theme/fonts/"
        horizonUiAssetNames.each { String assetName ->
            File destination = new File(outputDir, assetName)
            long minimumBytes = assetName.endsWith('.ttf') ? 1000L : 100L
            if (destination.isFile() && destination.length() >= minimumBytes) return
            HttpURLConnection connection = (HttpURLConnection) new URL(baseUrl + assetName).openConnection()
            connection.setConnectTimeout(20000)
            connection.setReadTimeout(45000)
            connection.setRequestProperty('User-Agent', 'MobileHorizonNative-UI-assets/1.0')
            try {
                int code = connection.getResponseCode()
                if (code != HttpURLConnection.HTTP_OK) {
                    throw new GradleException("Horizon UI asset download failed for ${assetName}: HTTP ${code}")
                }
                destination.withOutputStream { output ->
                    connection.getInputStream().withCloseable { input -> input.transferTo(output) }
                }
                if (!destination.isFile() || destination.length() < minimumBytes) {
                    destination.delete()
                    throw new GradleException("Horizon UI asset was empty or incomplete: ${assetName}")
                }
            } finally {
                connection.disconnect()
            }
        }
    }
}

tasks.named('preBuild').configure { dependsOn(downloadHorizonUiAssets) }

android {
    sourceSets {
        main {
            assets.srcDir(horizonUiAssetsDir)
        }
    }
    namespace 'dev.mobilehorizon.app'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_static'
            }
        }

        ndk {
            abiFilters 'arm64-v8a'
        }

        def msaClientId = providers.gradleProperty('HORIZON_MSA_CLIENT_ID').getOrElse('')
        buildConfigField 'String', 'HORIZON_MSA_CLIENT_ID',
                '"' + msaClientId.replace('\\', '\\\\').replace('"', '\\"') + '"'
        buildConfigField 'String', 'HORIZON_PC_RELEASE_TAG',
                '"' + horizonPcReleaseTag.replace('\\', '\\\\').replace('"', '\\"') + '"'
        buildConfigField 'String', 'HORIZON_TEST_OLD_RELEASE_TAG',
                '"' + horizonTestOldReleaseTag.replace('\\', '\\\\').replace('"', '\\"') + '"'
        applicationId 'dev.mobilehorizon.app'
        minSdk 26
        targetSdk 35
        versionCode 21
        versionName '0.3.18'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    externalNativeBuild {
        cmake {
            path file("../android-bootstrap/CMakeLists.txt")
            version "3.22.1"
        }
    }

    signingConfigs {
        stable {
            if (hasStableSigning) {
                storeFile file(stableStoreFile)
                storePassword stableStorePassword
                keyAlias stableKeyAlias
                keyPassword stableKeyPassword
            }
        }
    }

    flavorDimensions 'runtimeUpdater'

    productFlavors {
        standard {
            dimension 'runtimeUpdater'
            buildConfigField 'boolean', 'HORIZON_TEST_OLD_RUNTIME', 'false'
        }
        updaterTest {
            dimension 'runtimeUpdater'
            applicationIdSuffix '.updatertest'
            versionNameSuffix '-updater-test'
            buildConfigField 'boolean', 'HORIZON_TEST_OLD_RUNTIME', 'true'
        }
    }

    buildTypes {
        debug {
            // Without a persistent private signing key, publish a side-by-side
            // test package instead of an APK that could be mistaken for a safe update.
            applicationIdSuffix = hasStableSigning ? '.offline1' : '.offline1.test.v14'
            versionNameSuffix = hasStableSigning ? '-offline1' : '-offline1-test-v14'
            if (hasStableSigning) signingConfig signingConfigs.stable
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation project(':core')
    implementation 'org.tukaani:xz:1.10'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}
