plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.mobilehorizon.app'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'dev.mobilehorizon.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug250k'
            versionNameSuffix '-debug-250k'
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation project(':core')
    testImplementation 'junit:junit:4.13.2'
}
