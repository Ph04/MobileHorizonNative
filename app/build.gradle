plugins {
    id 'com.android.application'
}

def stableStoreFile = providers.gradleProperty('MOBILEHORIZON_STORE_FILE').getOrElse('')
def stableStorePassword = providers.gradleProperty('MOBILEHORIZON_STORE_PASSWORD').getOrElse('')
def stableKeyAlias = providers.gradleProperty('MOBILEHORIZON_KEY_ALIAS').getOrElse('')
def stableKeyPassword = providers.gradleProperty('MOBILEHORIZON_KEY_PASSWORD').getOrElse('')
def hasStableSigning = !stableStoreFile.isEmpty() && !stableStorePassword.isEmpty()
        && !stableKeyAlias.isEmpty() && !stableKeyPassword.isEmpty()

def horizonPcReleaseTag = providers.gradleProperty('HORIZON_PC_RELEASE_TAG').getOrElse('v0.2.50')
def horizonTestOldReleaseTag = providers.gradleProperty('HORIZON_TEST_OLD_RELEASE_TAG').getOrElse('v0.2.49')

android {
    namespace 'dev.mobilehorizon.app'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_static'
            }
        }

        ndk {
            abiFilters 'arm64-v8a'
        }

        def msaClientId = providers.gradleProperty('HORIZON_MSA_CLIENT_ID').getOrElse('')
        buildConfigField 'String', 'HORIZON_MSA_CLIENT_ID',
                '"' + msaClientId.replace('\\', '\\\\').replace('"', '\\"') + '"'
        buildConfigField 'String', 'HORIZON_PC_RELEASE_TAG',
                '"' + horizonPcReleaseTag.replace('\\', '\\\\').replace('"', '\\"') + '"'
        buildConfigField 'String', 'HORIZON_TEST_OLD_RELEASE_TAG',
                '"' + horizonTestOldReleaseTag.replace('\\', '\\\\').replace('"', '\\"') + '"'
        applicationId 'dev.mobilehorizon.app'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '0.3.11'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    externalNativeBuild {
        cmake {
            path file("../android-bootstrap/CMakeLists.txt")
            version "3.22.1"
        }
    }

    signingConfigs {
        stable {
            if (hasStableSigning) {
                storeFile file(stableStoreFile)
                storePassword stableStorePassword
                keyAlias stableKeyAlias
                keyPassword stableKeyPassword
            }
        }
    }

    flavorDimensions 'runtimeUpdater'

    productFlavors {
        standard {
            dimension 'runtimeUpdater'
            buildConfigField 'boolean', 'HORIZON_TEST_OLD_RUNTIME', 'false'
        }
        updaterTest {
            dimension 'runtimeUpdater'
            applicationIdSuffix '.updater-test'
            versionNameSuffix '-updater-test'
            buildConfigField 'boolean', 'HORIZON_TEST_OLD_RUNTIME', 'true'
        }
    }

    buildTypes {
        debug {
            // Without a persistent private signing key, publish a side-by-side
            // test package instead of an APK that could be mistaken for a safe update.
            applicationIdSuffix = hasStableSigning ? '.offline1' : '.offline1.test.v14'
            versionNameSuffix = hasStableSigning ? '-offline1' : '-offline1-test-v14'
            if (hasStableSigning) signingConfig signingConfigs.stable
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation project(':core')
    implementation 'org.tukaani:xz:1.10'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}
