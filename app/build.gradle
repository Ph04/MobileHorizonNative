plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.mobilehorizon.app'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        def msaClientId = providers.gradleProperty('HORIZON_MSA_CLIENT_ID').getOrElse('')
        buildConfigField 'String', 'HORIZON_MSA_CLIENT_ID',
                '"' + msaClientId.replace('\\', '\\\\').replace('"', '\\"') + '"'
        applicationId 'dev.mobilehorizon.app'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.3.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.offline1'
            versionNameSuffix '-offline1'
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation project(':core')
    implementation 'org.tukaani:xz:1.10'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}
