[package]
name = "mobilehorizon-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "horizon_android"
crate-type = ["cdylib"]

[dependencies]
horizon-client = { path = "../horizon-client", default-features = false, features = ["audio"] }
jni = "0.21.1"
pollster = "0.4"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
winit = { version = "0.30.13", features = ["android-native-activity"] }

[lints]
workspace = true
