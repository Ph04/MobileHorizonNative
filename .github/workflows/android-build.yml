name: Android build, official downloader and Horizon runtime

concurrency:
  group: mobilehorizon-android-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main", "feature/horizon-runtime-loader"]
    paths:
      - "app/**"
      - "core/**"
      - "android-native/**"
      - "android-bootstrap/**"
      - "tools/patch_horizon_android_touch.py"
      - "tools/horizon_patches/**"
      - "tools/tests/**"
      - "tools/horizon_server_packs.rs"
      - "tools/horizon-revisions.env"
      - "tools/setup_android_signing_termux.sh"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "app/**"
      - "core/**"
      - "android-native/**"
      - "android-bootstrap/**"
      - "tools/patch_horizon_android_touch.py"
      - "tools/horizon_patches/**"
      - "tools/tests/**"
      - "tools/horizon_server_packs.rs"
      - "tools/horizon-revisions.env"
      - "tools/setup_android_signing_termux.sh"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Termux signing helper syntax
        shell: bash
        run: bash -n tools/setup_android_signing_termux.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 cmake;3.22.1"

      - name: Install Android NDK with download retry
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          for attempt in 1 2 3 4; do
            # Discard partial/corrupt SDK downloads before retrying the package.
            rm -rf "$ANDROID_HOME/temp"
            if "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "ndk;27.2.12479018"; then
              break
            fi
            if [[ "$attempt" == 4 ]]; then
              echo "::error::Android NDK installation failed after $attempt attempts."
              exit 1
            fi
            echo "::warning::Android NDK download failed (attempt $attempt); retrying."
          done
          test -x "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"

      - name: Set up Rust toolchain for Android ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Preflight pinned Horizon overlay before expensive builds
        shell: bash
        run: |
          set -euo pipefail
          source tools/horizon-revisions.env
          SOURCE="$RUNNER_TEMP/horizon-overlay-preflight"
          git init "$SOURCE"
          git -C "$SOURCE" remote add origin https://github.com/ludovic111/horizon.git
          git -C "$SOURCE" fetch --depth 1 origin "$HORIZON_RUNTIME_COMMIT"
          git -C "$SOURCE" checkout --detach FETCH_HEAD
          test "$(git -C "$SOURCE" rev-parse HEAD)" = "$HORIZON_RUNTIME_COMMIT"
          python3 -m py_compile tools/patch_horizon_android_touch.py tools/horizon_patches/*.py
          python3 tools/patch_horizon_android_touch.py "$SOURCE"
          echo "All Horizon overlay anchors applied successfully to $HORIZON_RUNTIME_COMMIT."

      - name: Build and bundle full Horizon resource preparer
        shell: bash
        run: |
          set -euo pipefail
          source tools/horizon-revisions.env
          UPSTREAM_COMMIT="$HORIZON_PREPARE_COMMIT"
          SOURCE="$RUNNER_TEMP/horizon-upstream"
          git init "$SOURCE"
          git -C "$SOURCE" remote add origin https://github.com/ludovic111/horizon.git
          git -C "$SOURCE" fetch --depth 1 origin "$UPSTREAM_COMMIT"
          git -C "$SOURCE" checkout --detach FETCH_HEAD
          test "$(git -C "$SOURCE" rev-parse HEAD)" = "$UPSTREAM_COMMIT"

          # Apply the Android W^X workaround on the pinned source. targetSdk 35
          # cannot exec downloaded binaries from filesDir; java.rs must invoke the
          # system linker for both Java and javac rather than trying execve directly.
          python3 "$GITHUB_WORKSPACE/tools/patch_horizon_prepare_android_linker.py" "$SOURCE"
          # Backport the asset-index republish fix without moving the pinned upstream revision.
          python3 "$GITHUB_WORKSPACE/tools/patch_horizon_prepare_asset_index.py" "$SOURCE"
          grep -Fq 'asset_index_accepted' "$SOURCE/crates/horizon-prepare/src/artifacts.rs"
          grep -Fq 'accepted_asset_index_sha1' "$SOURCE/research-lock.json"
          grep -Fq 'asset_index_accepted' "$SOURCE/crates/horizon-prepare/src/sounds.rs"
          grep -Fq 'exec /system/bin/linker64' "$SOURCE/crates/horizon-prepare/src/java.rs"
          grep -Fq 'command.arg(java);' "$SOURCE/crates/horizon-prepare/src/java.rs"
          grep -Fq 'exec /system/bin/linker64' "$GITHUB_WORKSPACE/app/src/main/java/dev/mobilehorizon/app/JdkRuntimeInstaller.java"
          grep -Fq 'exec /system/bin/linker64' "$GITHUB_WORKSPACE/app/src/main/java/dev/mobilehorizon/app/HorizonPrepareRunner.java"
          echo "Verified shell-safe linker argument forwarding for Java/javac and the ARM64 preparer."

          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$TOOLCHAIN/aarch64-linux-android35-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android35-clang"
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android35-clang"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          cargo build --locked --release --manifest-path "$SOURCE/crates/horizon-prepare/Cargo.toml" --target aarch64-linux-android

          ASSETS="app/src/main/assets/horizon-prepare"
          mkdir -p "$ASSETS/support/mods/horizon/src/test/java/dev/horizonlab/parity"
          cp "$SOURCE/research-lock.json" "$ASSETS/support/research-lock.json"
          cp -a "$SOURCE/mods/horizon/src/test/java/dev/horizonlab/parity/." "$ASSETS/support/mods/horizon/src/test/java/dev/horizonlab/parity/"
          if test -f "$SOURCE/LICENSE"; then cp "$SOURCE/LICENSE" "$ASSETS/support/UPSTREAM-LICENSE.txt"; fi
          cp "$SOURCE/target/aarch64-linux-android/release/horizon-prepare" "$ASSETS/horizon-prepare-arm64"
          readelf -h "$ASSETS/horizon-prepare-arm64" > "$RUNNER_TEMP/horizon-prepare-elf-header.txt"
          grep -Fq "AArch64" "$RUNNER_TEMP/horizon-prepare-elf-header.txt"
          echo "Bundled the pinned ARM64 horizon-prepare executable and vanilla oracle sources."

          # Pin the Java 25 Android runtime package closure into the APK as metadata.
          # The runtime itself is downloaded on demand to app-private storage and hash checked.
          python3 - <<'PY'
          import gzip, json, lzma, re, urllib.request
          from pathlib import Path

          base = "https://packages.termux.dev/apt/termux-main/"
          index = None
          errors = []
          for suffix, decoder in [
              ("dists/stable/main/binary-aarch64/Packages", lambda b: b),
              ("dists/stable/main/binary-aarch64/Packages.gz", gzip.decompress),
              ("dists/stable/main/binary-aarch64/Packages.xz", lzma.decompress),
          ]:
              try:
                  with urllib.request.urlopen(base + suffix, timeout=60) as response:
                      payload = response.read(100 * 1024 * 1024 + 1)
                  if len(payload) > 100 * 1024 * 1024:
                      raise RuntimeError("APT package index is unexpectedly large")
                  index = decoder(payload).decode("utf-8")
                  break
              except Exception as error:
                  errors.append(f"{suffix}: {error}")
          if index is None:
              raise SystemExit("Cannot fetch the Termux ARM64 package index: " + "; ".join(errors))

          stanzas = []
          current = {}
          field = None
          for line in index.splitlines() + [""]:
              if not line:
                  if current.get("Package"):
                      stanzas.append(current)
                  current, field = {}, None
              elif line[:1].isspace() and field:
                  current[field] = current.get(field, "") + " " + line.strip()
              elif ":" in line:
                  field, value = line.split(":", 1)
                  current[field] = value.strip()

          candidates = {}
          for package in stanzas:
              name = package.get("Package", "")
              arch = package.get("Architecture", "")
              if not name or arch not in ("aarch64", "all"):
                  continue
              old = candidates.get(name)
              if old is None or (old.get("Architecture") == "all" and arch == "aarch64"):
                  candidates[name] = package

          selected, visiting = {}, set()
          system_provided = {"libc", "libm", "libdl", "liblog", "libandroid", "libjnigraphics"}
          def dependency_names(value):
              result = []
              for group in (value or "").split(","):
                  alternatives = group.split("|")
                  names = [re.match(r"\s*([A-Za-z0-9+.-]+)", item).group(1)
                           for item in alternatives
                           if re.match(r"\s*([A-Za-z0-9+.-]+)", item)]
                  chosen = next((n for n in names if n in candidates), None)
                  if chosen:
                      result.append(chosen)
                  elif names and not all(n in system_provided for n in names):
                      raise RuntimeError("Unresolved Termux package dependency: " + group.strip())
              return result

          def collect(name):
              if name in selected or name in system_provided:
                  return
              if name in visiting:
                  return
              if name not in candidates:
                  raise RuntimeError("Missing package in ARM64 index: " + name)
              visiting.add(name)
              package = candidates[name]
              for dep in dependency_names(package.get("Pre-Depends", "")):
                  collect(dep)
              for dep in dependency_names(package.get("Depends", "")):
                  collect(dep)
              visiting.remove(name)
              filename = package.get("Filename", "")
              digest = package.get("SHA256", "")
              size = int(package.get("Size", "0"))
              if not filename.startswith("pool/") or ".." in Path(filename).parts:
                  raise RuntimeError("Unsafe package filename: " + filename)
              if not re.fullmatch(r"[0-9a-fA-F]{64}", digest) or size <= 0:
                  raise RuntimeError("Package hash/size metadata missing for " + name)
              selected[name] = {
                  "name": name, "version": package.get("Version", ""),
                  "architecture": package.get("Architecture", ""),
                  "filename": filename, "sha256": digest.lower(), "size": size
              }

          collect("openjdk-25")
          java = selected.get("openjdk-25")
          if not java or not java["version"].startswith("25."):
              raise RuntimeError("Termux repository did not resolve a Java 25 package")
          packages = sorted(selected.values(), key=lambda p: p["name"])
          if sum(p["size"] for p in packages) > 600 * 1024 * 1024:
              raise RuntimeError("Java 25 runtime dependency set exceeds the 600 MiB safety limit")
          manifest = {
              "format": "mobilehorizon-termux-openjdk-runtime",
              "format_version": 1, "java_major": 25, "architecture": "aarch64",
              "repository": base, "packages": packages,
              "total_download_bytes": sum(p["size"] for p in packages)
          }
          out = Path("app/src/main/assets/horizon-prepare/jdk-manifest.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(manifest, indent=2) + "\n")
          print(f"Pinned {len(packages)} Termux packages ({manifest['total_download_bytes']} bytes) for Java {java['version']}")
          PY

      - name: Prepare stable APK signing key
        id: signing
        shell: bash
        env:
          MOBILEHORIZON_KEYSTORE_BASE64: ${{ secrets.MOBILEHORIZON_KEYSTORE_BASE64 }}
          MOBILEHORIZON_KEYSTORE_PASSWORD: ${{ secrets.MOBILEHORIZON_KEYSTORE_PASSWORD }}
          MOBILEHORIZON_KEY_ALIAS: ${{ secrets.MOBILEHORIZON_KEY_ALIAS }}
          MOBILEHORIZON_KEY_PASSWORD: ${{ secrets.MOBILEHORIZON_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${MOBILEHORIZON_KEYSTORE_BASE64:-}" || -z "${MOBILEHORIZON_KEYSTORE_PASSWORD:-}" || -z "${MOBILEHORIZON_KEY_ALIAS:-}" || -z "${MOBILEHORIZON_KEY_PASSWORD:-}" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Stable signing secrets are missing. The build will be checked, but no APK artifact will be published because a one-run debug key cannot guarantee safe upgrades."
            exit 0
          fi
          printf '%s' "$MOBILEHORIZON_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mobilehorizon-signing.jks"
          test -s "$RUNNER_TEMP/mobilehorizon-signing.jks"
          keytool -list -keystore "$RUNNER_TEMP/mobilehorizon-signing.jks" -storepass "$MOBILEHORIZON_KEYSTORE_PASSWORD" -alias "$MOBILEHORIZON_KEY_ALIAS" >/dev/null
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build Horizon NativeActivity client with touch-to-mouse translation
        shell: bash
        run: |
          set -euo pipefail
          # Keep desktop controller/HID backends disabled on Android to avoid
          # libudev/hidapi dependencies. CPAL audio is enabled by android-native's
          # horizon-client feature selection and uses Android's native audio backend.
          source tools/horizon-revisions.env
          UPSTREAM_COMMIT="$HORIZON_RUNTIME_COMMIT"
          UPSTREAM_TAG="$HORIZON_RUNTIME_RELEASE_TAG"
          echo "HORIZON_PC_RELEASE_TAG=$HORIZON_RUNTIME_RELEASE_TAG" >> "$GITHUB_ENV"
          echo "HORIZON_TEST_OLD_RELEASE_TAG=$HORIZON_TEST_OLD_RELEASE_TAG" >> "$GITHUB_ENV"
          SOURCE="$RUNNER_TEMP/horizon-native-upstream"
          git init "$SOURCE"
          git -C "$SOURCE" remote add origin https://github.com/ludovic111/horizon.git
          git -C "$SOURCE" fetch --depth 1 origin "$UPSTREAM_COMMIT"
          git -C "$SOURCE" checkout --detach FETCH_HEAD
          test "$(git -C "$SOURCE" rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          python3 -m py_compile tools/patch_horizon_android_touch.py tools/horizon_patches/*.py
          python3 tools/patch_horizon_android_touch.py "$SOURCE"
          cargo test --manifest-path "$SOURCE/Cargo.toml" -p horizon-mods --lib --no-default-features
          # Exercise the patched wire codecs and resource-pack/client tests too.
          # These target crates are platform-neutral and use no desktop audio/controllers.
          cargo test --manifest-path "$SOURCE/Cargo.toml" -p horizon-protocol --lib --no-default-features
          cargo test --manifest-path "$SOURCE/Cargo.toml" -p horizon-client --lib --no-default-features
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$TOOLCHAIN/aarch64-linux-android35-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android35-clang"
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android35-clang"
          export CXX_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android35-clang++"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          cargo build --release --no-default-features --manifest-path "$SOURCE/Cargo.toml" -p mobilehorizon-android --target aarch64-linux-android
          LIB="$SOURCE/target/aarch64-linux-android/release/libhorizon_engine.so"
          test -s "$LIB"
          # Keep the APK entry library small and stable; this is the independently updatable engine.
          "$TOOLCHAIN/llvm-readelf" -h "$LIB" > "$RUNNER_TEMP/horizon-engine-elf-header.txt"
          grep -Fq 'AArch64' "$RUNNER_TEMP/horizon-engine-elf-header.txt"
          "$TOOLCHAIN/llvm-readelf" -Ws "$LIB" > "$RUNNER_TEMP/horizon-engine-elf-symbols.txt"
          grep -Fq 'ANativeActivity_onCreate' "$RUNNER_TEMP/horizon-engine-elf-symbols.txt" || {
            echo "::error::The native engine is missing ANativeActivity_onCreate."
            exit 1
          }
          grep -Fq 'android_main' "$RUNNER_TEMP/horizon-engine-elf-symbols.txt" || {
            echo "::error::The native engine is missing android_main."
            exit 1
          }
          grep -Fq 'Java_dev_mobilehorizon_app_NativeGameActivity_nativeInjectCursorMove' "$RUNNER_TEMP/horizon-engine-elf-symbols.txt" || {
            echo "::error::The native engine is missing the touch/mouse JNI bridge."
            exit 1
          }
          RUNTIME_STAGE="$RUNNER_TEMP/horizon-runtime-stage"
          mkdir -p "$RUNTIME_STAGE"
          cp "$LIB" "$RUNTIME_STAGE/libhorizon_engine.so"
          ENGINE_SHA256="$(sha256sum "$LIB" | awk '{print $1}')"
          OVERLAY_SHA="$(cat android-native/Cargo.toml android-native/src/lib.rs tools/patch_horizon_android_touch.py tools/horizon_patches/01_offline_server_login.py tools/horizon_patches/02_android_native.py | sha256sum | awk '{print $1}' | cut -c1-8)"
          python3 - "$RUNTIME_STAGE/manifest.json" "$UPSTREAM_COMMIT" "$UPSTREAM_TAG" "$ENGINE_SHA256" "$OVERLAY_SHA" <<'PYMANIFEST'
          import json, sys
          manifest_path, commit, upstream_tag, digest, overlay = sys.argv[1:]
          manifest = {
              "format": 1,
              "version": "horizon-" + upstream_tag + "-c" + commit[:8] + "-o" + overlay,
              "upstream_tag": upstream_tag,
              "upstream_commit": commit,
              "overlay": overlay,
              "abi": "arm64-v8a",
              "library": "libhorizon_engine.so",
              "sha256": digest.lower(),
          }
          with open(manifest_path, "w", encoding="utf-8") as stream:
              json.dump(manifest, stream, indent=2)
              stream.write("\n")
          print(f"Staged Android Horizon engine {manifest['version']} with SHA-256 {digest}")
          PYMANIFEST
          echo "Built the engine for CI validation and updater-test fixtures only; it is not included in either APK."
          sha256sum "$RUNTIME_STAGE/libhorizon_engine.so" | tee "$RUNNER_TEMP/horizon-engine-sha256.txt"

      - name: Build and publish isolated updater-test fixture (previous PC release -> pinned PC release)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/horizon-runtime-loader' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source tools/horizon-revisions.env
          OLD_TAG="$HORIZON_TEST_OLD_RELEASE_TAG"
          CURRENT_TAG="$HORIZON_RUNTIME_RELEASE_TAG"
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android35-clang"
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android35-clang"
          export CXX_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android35-clang++"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          OVERLAY_SHA="$(cat android-native/Cargo.toml android-native/src/lib.rs tools/patch_horizon_android_touch.py tools/horizon_patches/01_offline_server_login.py tools/horizon_patches/02_android_native.py | sha256sum | awk '{print $1}' | cut -c1-8)"
          SOURCE_OLD="$RUNNER_TEMP/horizon-update-test-old"
          git init "$SOURCE_OLD"
          git -C "$SOURCE_OLD" remote add origin https://github.com/ludovic111/horizon.git
          git -C "$SOURCE_OLD" fetch --depth 1 origin "refs/tags/$OLD_TAG:refs/tags/$OLD_TAG"
          git -C "$SOURCE_OLD" checkout --detach "$OLD_TAG"
          OLD_COMMIT="$(git -C "$SOURCE_OLD" rev-parse HEAD)"
          python3 tools/patch_horizon_android_touch.py "$SOURCE_OLD"
          cargo build --release --no-default-features --manifest-path "$SOURCE_OLD/Cargo.toml" -p mobilehorizon-android --target aarch64-linux-android
          OLD_LIB="$SOURCE_OLD/target/aarch64-linux-android/release/libhorizon_engine.so"
          test -s "$OLD_LIB"
          "$TOOLCHAIN/llvm-readelf" -h "$OLD_LIB" > "$RUNNER_TEMP/horizon-old-engine-header.txt"
          grep -Fq 'AArch64' "$RUNNER_TEMP/horizon-old-engine-header.txt"
          "$TOOLCHAIN/llvm-readelf" -Ws "$OLD_LIB" > "$RUNNER_TEMP/horizon-old-engine-symbols.txt"
          grep -Fq 'ANativeActivity_onCreate' "$RUNNER_TEMP/horizon-old-engine-symbols.txt"
          grep -Fq 'android_main' "$RUNNER_TEMP/horizon-old-engine-symbols.txt"
          grep -Fq 'Java_dev_mobilehorizon_app_NativeGameActivity_nativeInjectCursorMove' "$RUNNER_TEMP/horizon-old-engine-symbols.txt"

          FIXTURE_DIR="$RUNNER_TEMP/horizon-runtime-update-test"
          mkdir -p "$FIXTURE_DIR"
          CURRENT_LIB="$RUNNER_TEMP/horizon-runtime-stage/libhorizon_engine.so"
          CURRENT_COMMIT="$HORIZON_RUNTIME_COMMIT"
          CURRENT_SHA="$(sha256sum "$CURRENT_LIB" | awk '{print $1}')"
          OLD_SHA="$(sha256sum "$OLD_LIB" | awk '{print $1}')"
          python3 - "$FIXTURE_DIR" "$OLD_TAG" "$OLD_COMMIT" "$OVERLAY_SHA" "$OLD_SHA" "$OLD_LIB" "$CURRENT_TAG" "$CURRENT_COMMIT" "$CURRENT_SHA" "$CURRENT_LIB" <<'PYFIXTURE'
          import json, pathlib, shutil, sys
          out_dir, old_tag, old_commit, overlay, old_sha, old_lib, current_tag, current_commit, current_sha, current_lib = sys.argv[1:]
          def write_manifest(tag, commit, digest, source_library):
              version = f"horizon-{tag}-c{commit[:8]}-o{overlay}"
              binary = f"horizon-runtime-{version}-arm64-v8a.so"
              shutil.copy2(source_library, pathlib.Path(out_dir) / binary)
              data = {
                  "format": 1,
                  "version": version,
                  "upstream_tag": tag,
                  "upstream_commit": commit,
                  "overlay": overlay,
                  "abi": "arm64-v8a",
                  "library": binary,
                  "sha256": digest.lower(),
              }
              path = pathlib.Path(out_dir) / f"horizon-runtime-{version}-manifest.json"
              path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
              print(f"Prepared test updater fixture: {tag} {version} SHA-256 {digest}")
          write_manifest(old_tag, old_commit, old_sha, old_lib)
          write_manifest(current_tag, current_commit, current_sha, current_lib)
          PYFIXTURE

          TEST_RELEASE_TAG="horizon-runtime-update-test"
          OLD_SHORT="$(printf %.8s "$OLD_COMMIT")"
          CURRENT_SHORT="$(printf %.8s "$CURRENT_COMMIT")"
          OLD_VERSION="horizon-$OLD_TAG-c$OLD_SHORT-o$OVERLAY_SHA"
          CURRENT_VERSION="horizon-$CURRENT_TAG-c$CURRENT_SHORT-o$OVERLAY_SHA"
          OLD_BINARY="$FIXTURE_DIR/horizon-runtime-$OLD_VERSION-arm64-v8a.so"
          OLD_MANIFEST="$FIXTURE_DIR/horizon-runtime-$OLD_VERSION-manifest.json"
          CURRENT_BINARY="$FIXTURE_DIR/horizon-runtime-$CURRENT_VERSION-arm64-v8a.so"
          CURRENT_MANIFEST="$FIXTURE_DIR/horizon-runtime-$CURRENT_VERSION-manifest.json"
          NOTES="TEST ONLY: prerelease fixture for MobileHorizonNative's updater test APK. Includes Android engines built from $OLD_TAG and $CURRENT_TAG. Not used by the stable updater."
          if gh release view "$TEST_RELEASE_TAG" >/dev/null 2>&1; then
            while IFS= read -r asset_name; do
              [[ -z "$asset_name" ]] && continue
              gh release delete-asset "$TEST_RELEASE_TAG" "$asset_name" --yes
            done < <(gh release view "$TEST_RELEASE_TAG" --json assets --jq '.assets[].name')
            gh release upload "$TEST_RELEASE_TAG" "$OLD_BINARY" "$OLD_MANIFEST" "$CURRENT_BINARY" "$CURRENT_MANIFEST"
          else
            gh release create "$TEST_RELEASE_TAG" "$OLD_BINARY" "$OLD_MANIFEST" "$CURRENT_BINARY" "$CURRENT_MANIFEST" --title "TEST ONLY — Horizon runtime updater fixture" --notes "$NOTES" --prerelease
          fi
          echo "Published prerelease updater fixture $TEST_RELEASE_TAG ($OLD_TAG -> $CURRENT_TAG)." >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run compatibility tests and build APK variants
        shell: bash
        env:
          HORIZON_MSA_CLIENT_ID: ${{ vars.HORIZON_MSA_CLIENT_ID }}
          MOBILEHORIZON_KEYSTORE_PASSWORD: ${{ secrets.MOBILEHORIZON_KEYSTORE_PASSWORD }}
          MOBILEHORIZON_KEY_ALIAS: ${{ secrets.MOBILEHORIZON_KEY_ALIAS }}
          MOBILEHORIZON_KEY_PASSWORD: ${{ secrets.MOBILEHORIZON_KEY_PASSWORD }}
          STABLE_SIGNING: ${{ steps.signing.outputs.enabled }}
        run: |
          set -euo pipefail
          args=("-PHORIZON_MSA_CLIENT_ID=$HORIZON_MSA_CLIENT_ID")
          args+=("-PHORIZON_PC_RELEASE_TAG=$HORIZON_PC_RELEASE_TAG")
          args+=("-PHORIZON_TEST_OLD_RELEASE_TAG=$HORIZON_TEST_OLD_RELEASE_TAG")
          if [[ "$STABLE_SIGNING" == "true" ]]; then
            args+=("-PMOBILEHORIZON_STORE_FILE=$RUNNER_TEMP/mobilehorizon-signing.jks")
            args+=("-PMOBILEHORIZON_STORE_PASSWORD=$MOBILEHORIZON_KEYSTORE_PASSWORD")
            args+=("-PMOBILEHORIZON_KEY_ALIAS=$MOBILEHORIZON_KEY_ALIAS")
            args+=("-PMOBILEHORIZON_KEY_PASSWORD=$MOBILEHORIZON_KEY_PASSWORD")
          fi
          gradle --no-daemon "${args[@]}" test :app:assembleStandardDebug :app:assembleUpdaterTestDebug

      - name: Verify standard and updater-test APKs
        shell: bash
        env:
          STABLE_SIGNING: ${{ steps.signing.outputs.enabled }}
        run: |
          set -euo pipefail
          STANDARD_APK="app/build/outputs/apk/standard/debug/app-standard-debug.apk"
          TEST_APK="app/build/outputs/apk/updaterTest/debug/app-updaterTest-debug.apk"
          for APK in "$STANDARD_APK" "$TEST_APK"; do
            test -s "$APK"
            unzip -tq "$APK"
            unzip -l "$APK" > "$RUNNER_TEMP/apk-file-list.txt"
            grep -Fq 'lib/arm64-v8a/libhorizon_android.so' "$RUNNER_TEMP/apk-file-list.txt"
            if grep -Fq 'assets/horizon-runtime/libhorizon_engine.so' "$RUNNER_TEMP/apk-file-list.txt" \
              || grep -Fq 'assets/horizon-runtime/manifest.json' "$RUNNER_TEMP/apk-file-list.txt"; then
              echo "::error::The APK must not bundle a fixed Horizon engine; it must download a verified runtime on first launch."
              exit 1
            fi
            grep -Fq 'assets/horizon-prepare/horizon-prepare-arm64' "$RUNNER_TEMP/apk-file-list.txt"
            grep -Fq 'assets/horizon-prepare/jdk-manifest.json' "$RUNNER_TEMP/apk-file-list.txt"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/one-apk-badging.txt"
            grep -F "name='dev.mobilehorizon.app" "$RUNNER_TEMP/one-apk-badging.txt"
            grep -F "versionCode='14'" "$RUNNER_TEMP/one-apk-badging.txt"
            sha256sum "$APK"
            CERT_SHA256="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')"
            echo "$APK signer certificate SHA-256: $CERT_SHA256"
          done
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$STANDARD_APK" > "$RUNNER_TEMP/standard-apk-badging.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$TEST_APK" > "$RUNNER_TEMP/test-apk-badging.txt"
          grep -Eq "versionName='0.3.11.*updater-test" "$RUNNER_TEMP/test-apk-badging.txt"
          grep -Eq "name='dev\\.mobilehorizon\\.app[^']*updatertest[^']*'" "$RUNNER_TEMP/test-apk-badging.txt"
          test -s "$RUNNER_TEMP/horizon-runtime-stage/libhorizon_engine.so"
          test -s "$RUNNER_TEMP/horizon-runtime-stage/manifest.json"
          grep -Fq "upstream_tag" "$RUNNER_TEMP/horizon-runtime-stage/manifest.json"
          grep -Fq "sha256" "$RUNNER_TEMP/horizon-runtime-stage/manifest.json"
          grep -Fq "HORIZON_TEST_OLD_RUNTIME = true" app/build/generated/source/buildConfig/updaterTest/debug/dev/mobilehorizon/app/BuildConfig.java
          if [[ "$STABLE_SIGNING" != "true" ]]; then
            echo "::warning::APK artifacts use a test signing identity and isolated package IDs; they cannot replace the stable app installation."
            echo "Standard APK and updater-test APK are isolated test builds because persistent signing secrets are unavailable." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Verified standard APK and updater-test APK. Test sequence: download $HORIZON_TEST_OLD_RELEASE_TAG first, then update to $HORIZON_PC_RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload update-safe standard APK
        if: success() && steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mobilehorizon-native-offline1-update-safe
          path: app/build/outputs/apk/standard/debug/app-standard-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload standard isolated test APK
        if: success() && steps.signing.outputs.enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mobilehorizon-native-offline1-test-only
          path: app/build/outputs/apk/standard/debug/app-standard-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Horizon updater test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mobilehorizon-native-horizon-updater-test
          path: app/build/outputs/apk/updaterTest/debug/app-updaterTest-debug.apk
          if-no-files-found: error
          retention-days: 14
