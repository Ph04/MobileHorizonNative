name: Android build, official downloader and Horizon runtime

concurrency:
  group: mobilehorizon-android-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - "core/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "app/**"
      - "core/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      # Reuse the previous repo's committed source bundle only as a source for the
      # native runtime. Both the archive and shared-library hashes are pinned below.
      # The runtime is not compiled on the player's phone and is not pulled from an
      # unverified release URL.
      - name: Fetch and verify pinned ARM64 Horizon runtime
        shell: bash
        run: |
          set -euo pipefail
          TEMP_DIR="$RUNNER_TEMP/mobilehorizon-legacy"
          mkdir -p "$TEMP_DIR"
          BASE="https://raw.githubusercontent.com/Ph04/MobileHorizon/main"
          for part in 00 01 02; do
            curl --fail --location --retry 3 --retry-all-errors \
              "$BASE/HorizonAndroidPrep_0.9.7_with_native.zip.part-$part" \
              --output "$TEMP_DIR/source.zip.part-$part"
          done
          cat "$TEMP_DIR"/source.zip.part-* > "$TEMP_DIR/source.zip"
          echo "c3e8de14e3beacbff203f2134afabe3fb801bea8eda7de42491aacfe00a2b302  $TEMP_DIR/source.zip" | sha256sum --check -
          unzip -tq "$TEMP_DIR/source.zip"
          mkdir -p "$TEMP_DIR/unpacked"
          unzip -q "$TEMP_DIR/source.zip" -d "$TEMP_DIR/unpacked"
          LIB="$TEMP_DIR/unpacked/HorizonAndroidPrep/prebuilt/android/arm64-v8a/libhorizon_android.so"
          test -s "$LIB"
          echo "9d564adb67e7aa9b36c5ae66f4e6cf1a74549746216220bc5a1cba235421ab82  $LIB" | sha256sum --check -
          readelf -h "$LIB" | grep -q "AArch64"
          readelf -Ws "$LIB" | grep -q "ANativeActivity_onCreate"
          readelf -Ws "$LIB" | grep -q "android_main"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$LIB" app/src/main/jniLibs/arm64-v8a/libhorizon_android.so
          echo "Verified and staged libhorizon_android.so for arm64-v8a."

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run compatibility tests and build debug APK
        env:
          HORIZON_MSA_CLIENT_ID: ${{ vars.HORIZON_MSA_CLIENT_ID }}
        run: gradle --no-daemon "-PHORIZON_MSA_CLIENT_ID=$HORIZON_MSA_CLIENT_ID" test :app:assembleDebug

      - name: Verify native runtime is packaged in APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libhorizon_android.so'
          echo "libhorizon_android.so is present in the APK."

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mobilehorizon-native-download1-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
