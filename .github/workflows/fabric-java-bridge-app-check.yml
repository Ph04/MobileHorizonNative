name: Validate Java Bridge By:iaxivers Android integration (no APK)

on:
  push:
    branches: ["feature/fabric-java-bridge-test"]
    paths:
      - "app/src/main/java/dev/mobilehorizon/app/FabricBridgeRuntimeManager.java"
      - "app/src/main/java/dev/mobilehorizon/app/FabricModManager.java"
      - "app/src/main/java/dev/mobilehorizon/app/FabricModsActivity.java"
      - "app/src/main/java/dev/mobilehorizon/app/GameProfileManager.java"
      - "app/src/main/java/dev/mobilehorizon/app/NativeGameActivity.java"
      - "app/src/main/java/dev/mobilehorizon/app/MainActivity.java"
      - "app/src/main/java/dev/mobilehorizon/app/OfficialDownloadService.java"
      - "app/src/main/java/dev/mobilehorizon/app/OfficialMinecraftInstaller.java"
      - "app/src/main/java/dev/mobilehorizon/app/HorizonPrepareRunner.java"
      - "app/src/main/java/dev/mobilehorizon/app/InstancesActivity.java"
      - "app/src/main/java/dev/mobilehorizon/app/UiLanguage.java"
      - "app/src/main/java/dev/mobilehorizon/app/CompatibilityModulesActivity.java"
      - "app/src/main/java/dev/mobilehorizon/app/MainActivity.java"
      - "app/src/main/java/dev/mobilehorizon/app/OfficialDownloadService.java"
      - "app/src/main/java/dev/mobilehorizon/app/OfficialMinecraftInstaller.java"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/test/**"
      - "compatibility-api/**"
      - "app/build.gradle"
      - "android-bootstrap/CMakeLists.txt"
      - "tools/lwjgl_android/**"
      - "settings.gradle"
      - ".github/workflows/fabric-java-bridge-app-check.yml"
  pull_request:
    paths:
      - "app/src/main/java/dev/mobilehorizon/app/FabricBridgeRuntimeManager.java"
      - "app/src/main/java/dev/mobilehorizon/app/FabricModManager.java"
      - "app/src/main/java/dev/mobilehorizon/app/FabricModsActivity.java"
      - "app/src/main/java/dev/mobilehorizon/app/GameProfileManager.java"
      - "app/src/main/java/dev/mobilehorizon/app/NativeGameActivity.java"
      - "app/src/main/java/dev/mobilehorizon/app/InstancesActivity.java"
      - "app/src/main/java/dev/mobilehorizon/app/UiLanguage.java"
      - "app/src/main/java/dev/mobilehorizon/app/CompatibilityModulesActivity.java"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/test/**"
      - "app/build.gradle"
      - "settings.gradle"
      - ".github/workflows/fabric-java-bridge-app-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabric-bridge-app-java-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-java:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out MobileHorizonNative
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 cmake;3.22.1 ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build ARM64 LWJGL memory shim without assembling APK
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          BUILD_DIR="$RUNNER_TEMP/lwjgl-android-shim"
          cmake -S android-bootstrap -B "$BUILD_DIR" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$BUILD_DIR" --target lwjgl --parallel 2
          LIB="$BUILD_DIR/liblwjgl.so"
          test -s "$LIB"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$LIB" > "$RUNNER_TEMP/lwjgl-elf.txt"
          grep -Fq "AArch64" "$RUNNER_TEMP/lwjgl-elf.txt"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D --defined-only "$LIB" > "$RUNNER_TEMP/lwjgl-symbols.txt"
          for symbol in \
            Java_org_lwjgl_system_MemoryUtil_ngetPageSize \
            Java_org_lwjgl_system_MemoryUtil_ngetCacheLineSize \
            Java_org_lwjgl_system_MemoryUtil_memGlobalRefToObject \
            Java_org_lwjgl_system_MemoryAccessJNI_getPointerSize \
            Java_org_lwjgl_system_MemoryAccessJNI_malloc \
            Java_org_lwjgl_system_MemoryAccessJNI_calloc \
            Java_org_lwjgl_system_MemoryAccessJNI_realloc \
            Java_org_lwjgl_system_MemoryAccessJNI_free \
            Java_org_lwjgl_system_libc_LibCStdlib_nmalloc \
            Java_org_lwjgl_system_libc_LibCStdlib_ncalloc \
            Java_org_lwjgl_system_libc_LibCStdlib_nrealloc \
            Java_org_lwjgl_system_libc_LibCStdlib_nfree \
            Java_org_lwjgl_system_libc_LibCString_nmemset__JIJ \
            Java_org_lwjgl_system_libc_LibCString_nmemcpy__JJJ; do
              grep -Fq "$symbol" "$RUNNER_TEMP/lwjgl-symbols.txt" || {
                echo "::error::Missing LWJGL JNI symbol: $symbol"
                exit 1
              }
          done
          echo "ARM64 LWJGL core memory JNI shim compiled and exported all required bootstrap symbols. No APK was assembled." >> "$GITHUB_STEP_SUMMARY"

      - name: Compile Android Java sources and run unit tests (no APK tasks)
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:compileStandardDebugJavaWithJavac :app:testStandardDebugUnitTest

      - name: Assert that no APK or bundle was assembled
        shell: bash
        run: |
          set -euo pipefail
          if find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit 2>/dev/null | grep -q .; then
            echo "::error::The Java validation unexpectedly produced an APK or app bundle."
            exit 1
          fi
          echo "Android Java sources and unit tests passed. No APK or AAB was assembled." >> "$GITHUB_STEP_SUMMARY"
