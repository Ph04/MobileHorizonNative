name: Validate Java Bridge By:iaxivers Android integration (no APK)

on:
  push:
    branches: ["feature/fabric-java-bridge-test"]
    paths:
      - "app/src/main/java/dev/mobilehorizon/app/FabricBridgeRuntimeManager.java"
      - "app/src/main/java/dev/mobilehorizon/app/FabricModManager.java"
      - "app/src/main/java/dev/mobilehorizon/app/FabricModsActivity.java"
      - "app/src/main/java/dev/mobilehorizon/app/GameProfileManager.java"
      - "app/src/main/java/dev/mobilehorizon/app/NativeGameActivity.java"
      - "app/src/main/java/dev/mobilehorizon/app/GameMemoryGuard.java"
      - "app/src/main/java/dev/mobilehorizon/app/ConsoleActivity.java"
      - "app/src/main/java/dev/mobilehorizon/app/MainActivity.java"
      - "app/src/main/java/dev/mobilehorizon/app/OfficialDownloadService.java"
      - "app/src/main/java/dev/mobilehorizon/app/OfficialMinecraftInstaller.java"
      - "app/src/main/java/dev/mobilehorizon/app/HorizonPrepareRunner.java"
      - "app/src/main/java/dev/mobilehorizon/app/InstancesActivity.java"
      - "app/src/main/java/dev/mobilehorizon/app/UiLanguage.java"
      - "app/src/main/java/dev/mobilehorizon/app/CompatibilityModulesActivity.java"
      - "app/src/main/java/dev/mobilehorizon/app/MainActivity.java"
      - "app/src/main/java/dev/mobilehorizon/app/OfficialDownloadService.java"
      - "app/src/main/java/dev/mobilehorizon/app/OfficialMinecraftInstaller.java"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/test/**"
      - "compatibility-api/**"
      - "app/build.gradle"
      - "android-bootstrap/CMakeLists.txt"
      - "android-bootstrap/prebuilt/**"
      - "tools/build_lwjgl_android.sh"
      - "settings.gradle"
      - ".github/workflows/fabric-java-bridge-app-check.yml"
  pull_request:
    paths:
      - "app/src/main/java/dev/mobilehorizon/app/FabricBridgeRuntimeManager.java"
      - "app/src/main/java/dev/mobilehorizon/app/FabricModManager.java"
      - "app/src/main/java/dev/mobilehorizon/app/FabricModsActivity.java"
      - "app/src/main/java/dev/mobilehorizon/app/GameProfileManager.java"
      - "app/src/main/java/dev/mobilehorizon/app/NativeGameActivity.java"
      - "app/src/main/java/dev/mobilehorizon/app/GameMemoryGuard.java"
      - "app/src/main/java/dev/mobilehorizon/app/ConsoleActivity.java"
      - "app/src/main/java/dev/mobilehorizon/app/InstancesActivity.java"
      - "app/src/main/java/dev/mobilehorizon/app/UiLanguage.java"
      - "app/src/main/java/dev/mobilehorizon/app/CompatibilityModulesActivity.java"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/test/**"
      - "app/build.gradle"
      - "android-bootstrap/**"
      - "tools/build_lwjgl_android.sh"
      - "settings.gradle"
      - ".github/workflows/fabric-java-bridge-app-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabric-bridge-app-java-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-java:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out MobileHorizonNative
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 cmake;3.22.1 ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build complete ARM64 LWJGL 3.4.1 core (no APK)
        shell: bash
        run: |
          set -euo pipefail
          tools/build_lwjgl_android.sh "$RUNNER_TEMP/lwjgl-android"
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          BUILD_DIR="$RUNNER_TEMP/lwjgl-android-cmake"
          cmake -S android-bootstrap -B "$BUILD_DIR" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$BUILD_DIR" --target horizon_android --parallel 2
          BOOTSTRAP="$BUILD_DIR/libhorizon_android.so"
          test -s "$BOOTSTRAP"
          JNI_LIBRARY="app/src/main/jniLibs/arm64-v8a/liblwjgl.so"
          test -s "$JNI_LIBRARY"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$JNI_LIBRARY" > "$RUNNER_TEMP/lwjgl-elf-header.txt"
          grep -Fq "AArch64" "$RUNNER_TEMP/lwjgl-elf-header.txt"
          echo "Complete LWJGL 3.4.1 core + static libffi staged as an Android JNI library. No APK built." >> "$GITHUB_STEP_SUMMARY"

      - name: Compile Android Java sources and run unit tests (no APK tasks)
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:compileStandardDebugJavaWithJavac :app:testStandardDebugUnitTest

      - name: Assert that no APK or bundle was assembled
        shell: bash
        run: |
          set -euo pipefail
          if find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit 2>/dev/null | grep -q .; then
            echo "::error::The Java validation unexpectedly produced an APK or app bundle."
            exit 1
          fi
          echo "Android Java sources and unit tests passed. No APK or AAB was assembled." >> "$GITHUB_STEP_SUMMARY"
