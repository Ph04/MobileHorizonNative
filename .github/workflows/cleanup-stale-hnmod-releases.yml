name: Clean abandoned temporary HNMOD uploads

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    name: Remove abandoned public HNMOD releases
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Remove temporary uploads older than 24 hours
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, os, urllib.error, urllib.parse, urllib.request

          repo = "Ph04/MobileHorizonNative"
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + token,
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "MobileHorizonNative-HNMOD-stale-cleanup",
          }
          cutoff = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(hours=24)

          def request(method, path):
              url = "https://api.github.com/repos/" + repo + path
              req = urllib.request.Request(url, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = response.read(4 * 1024 * 1024 + 1)
                      if len(data) > 4 * 1024 * 1024:
                          raise RuntimeError("GitHub cleanup response exceeded the safety limit.")
                      return response.status, data
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return 404, b""
                  detail = error.read(4096).decode("utf-8", errors="replace")
                  raise RuntimeError(f"GitHub API returned HTTP {error.code}: {detail}")

          page = 1
          removed = 0
          while page <= 10:
              status, body = request("GET", f"/releases?per_page=100&page={page}")
              if status != 200:
                  break
              releases = json.loads(body.decode("utf-8"))
              if not releases:
                  break
              for release in releases:
                  tag = str(release.get("tag_name", ""))
                  if not tag.startswith("hnmod-input-"):
                      continue
                  try:
                      created = datetime.datetime.fromisoformat(
                          str(release.get("created_at", "")).replace("Z", "+00:00"))
                  except ValueError:
                      continue
                  if created >= cutoff:
                      continue
                  release_id = int(release.get("id", 0))
                  if release_id:
                      request("DELETE", "/releases/" + str(release_id))
                  encoded = urllib.parse.quote(tag, safe="")
                  request("DELETE", "/git/refs/tags/" + encoded)
                  removed += 1
                  print("Removed stale temporary HNMOD release:", tag)
              page += 1
          print(f"Stale HNMOD cleanup finished. Removed {removed} release(s).")
          PY
