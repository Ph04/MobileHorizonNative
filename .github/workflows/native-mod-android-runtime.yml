name: Build Horizon native mods runtime (Android ARM64)

on:
  # This branch-local trigger keeps native builds available without adding a workflow
  # to main. A push only builds when its commit explicitly carries the trust marker.
  push:
    branches: ["feature/fabric-java-bridge-test"]
    paths:
      - "native-mods/*.hnmod"
      - "native-mods/*.hmod"
  workflow_dispatch:
    inputs:
      trust_confirmation:
        description: "Confirm that you reviewed and trust every Rust source package in native-mods/"
        required: true
        type: choice
        options:
          - "I TRUST THESE NATIVE MODS"
          - "CANCEL - DO NOT BUILD"

permissions:
  contents: read

concurrency:
  group: horizon-native-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: (github.event_name == 'workflow_dispatch' && inputs.trust_confirmation == 'I TRUST THESE NATIVE MODS') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[trust-native-mods]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout MobileHorizonNative source packages and Android overlay
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Rust toolchain and Android target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: aarch64-linux-android

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          for attempt in 1 2 3 4; do
            rm -rf "$ANDROID_HOME/temp"
            if "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "ndk;27.2.12479018"; then
              break
            fi
            if [[ "$attempt" == 4 ]]; then
              echo "::error::Android NDK installation failed after $attempt attempts."
              exit 1
            fi
            echo "::warning::Android NDK install failed (attempt $attempt); retrying."
          done
          test -x "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"

      - name: Resolve exact official Horizon Nightly
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          headers = {
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "MobileHorizonNative-native-mod-build",
          }
          def get(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))
          release = get("https://api.github.com/repos/horizon-rust/horizon/releases/tags/nightly")
          if release.get("tag_name") != "nightly" or release.get("draft") or not release.get("prerelease"):
              raise SystemExit("Official Horizon Nightly is absent or malformed.")
          ref = get("https://api.github.com/repos/horizon-rust/horizon/git/ref/tags/nightly")
          obj = ref["object"]
          for _ in range(8):
              if obj["type"] != "tag":
                  break
              obj = get("https://api.github.com/repos/horizon-rust/horizon/git/tags/" + obj["sha"])["object"]
          if obj.get("type") != "commit" or len(obj.get("sha", "")) != 40:
              raise SystemExit("Official Nightly tag did not resolve to a full commit SHA.")
          commit = obj["sha"].lower()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("commit=" + commit + "\n")
          print("Selected Horizon Nightly:", commit)
          PY

      - name: Fetch immutable Horizon source
        env:
          HORIZON_COMMIT: ${{ steps.upstream.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/horizon-native-source"
          git init "$SOURCE"
          git -C "$SOURCE" remote add origin https://github.com/horizon-rust/horizon.git
          git -C "$SOURCE" fetch --depth 1 origin "$HORIZON_COMMIT"
          git -C "$SOURCE" checkout --detach FETCH_HEAD
          test "$(git -C "$SOURCE" rev-parse HEAD)" = "$HORIZON_COMMIT"
          echo "HORIZON_SOURCE=$SOURCE" >> "$GITHUB_ENV"

      - name: Validate packages and apply horizon-mixins to a clean source copy
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/build_horizon_native_android_runtime.py
          python3 tools/build_horizon_native_android_runtime.py \
            --source "$HORIZON_SOURCE" \
            --mod-dir "$GITHUB_WORKSPACE/native-mods" \
            --out-dir "$RUNNER_TEMP/horizon-native-build"
          STAGE="$RUNNER_TEMP/horizon-native-build/stage"
          test -s "$STAGE/Cargo.toml"
          echo "HORIZON_NATIVE_STAGE=$STAGE" >> "$GITHUB_ENV"
          echo "HORIZON_NATIVE_METADATA=$RUNNER_TEMP/horizon-native-build/metadata.json" >> "$GITHUB_ENV"

      - name: Apply MobileHorizonNative Android compatibility overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/patch_horizon_android_touch.py tools/horizon_patches/*.py
          python3 tools/patch_horizon_android_touch.py "$HORIZON_NATIVE_STAGE"
          test -s "$HORIZON_NATIVE_STAGE/crates/mobilehorizon-android/Cargo.toml"

      - name: Compile the modded Horizon engine for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android35-clang"
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android35-clang"
          export CXX_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android35-clang++"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          export CARGO_BUILD_JOBS=2
          cargo build --release --no-default-features \
            --manifest-path "$HORIZON_NATIVE_STAGE/Cargo.toml" \
            -p mobilehorizon-android --target aarch64-linux-android

          LIB="$HORIZON_NATIVE_STAGE/target/aarch64-linux-android/release/libhorizon_engine.so"
          test -s "$LIB"
          "$TOOLCHAIN/llvm-readelf" -h "$LIB" > "$RUNNER_TEMP/native-engine-header.txt"
          grep -Fq "AArch64" "$RUNNER_TEMP/native-engine-header.txt"
          "$TOOLCHAIN/llvm-readelf" -Ws "$LIB" > "$RUNNER_TEMP/native-engine-symbols.txt"
          grep -Fq "ANativeActivity_onCreate" "$RUNNER_TEMP/native-engine-symbols.txt"
          grep -Fq "android_main" "$RUNNER_TEMP/native-engine-symbols.txt"

      - name: Package runtime and manifest
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$RUNNER_TEMP/native-runtime-release"
          mkdir -p "$OUTPUT"
          cp "$HORIZON_NATIVE_STAGE/target/aarch64-linux-android/release/libhorizon_engine.so" \
             "$OUTPUT/horizon-native-runtime-arm64-v8a.so"
          python3 - "$HORIZON_NATIVE_METADATA" "$OUTPUT/horizon-native-runtime-manifest.json" \
            "$OUTPUT/horizon-native-runtime-arm64-v8a.so" <<'PY'
          import hashlib, json, pathlib, sys
          metadata_path, manifest_path, engine_path = sys.argv[1:]
          metadata = json.loads(pathlib.Path(metadata_path).read_text(encoding="utf-8"))
          engine = pathlib.Path(engine_path)
          manifest = dict(metadata)
          manifest["sha256"] = hashlib.sha256(engine.read_bytes()).hexdigest()
          pathlib.Path(manifest_path).write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          print("Runtime tag:", manifest["tag"])
          print("Native mods SHA-256:", manifest["mods_sha256"])
          print("Engine SHA-256:", manifest["sha256"])
          PY
          echo "NATIVE_RUNTIME_OUTPUT=$OUTPUT" >> "$GITHUB_ENV"

      - name: Upload compiled runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: horizon-native-android-runtime
          path: ${{ runner.temp }}/native-runtime-release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download compiled runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: horizon-native-android-runtime
          path: native-runtime-release

      - name: Publish versioned native runtime (not an APK)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(python3 -c 'import json; print(json.load(open("native-runtime-release/horizon-native-runtime-manifest.json"))["tag"])')"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" native-runtime-release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" native-runtime-release/* \
              --title "Horizon Android native mods $TAG" \
              --notes "ARM64 Android runtime compiled from the official Horizon Nightly with the native source packages listed in the manifest. Not an APK." \
              --repo "$GITHUB_REPOSITORY"
          fi
          echo "Published $TAG with Android ARM64 runtime and SHA-256 manifest."
