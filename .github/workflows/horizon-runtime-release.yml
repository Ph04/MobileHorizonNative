name: Publish Android Horizon runtime

on:
  schedule:
    - cron: "17 * * * *"
  workflow_call:
    inputs:
      source_ref:
        description: "Branch containing the live Android updater code."
        required: false
        type: string
        default: feature/horizon-runtime-loader
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch to build the Android Horizon runtime from."
        required: true
        type: string
        default: feature/horizon-runtime-loader
  push:
    branches: ["feature/horizon-runtime-loader"]
    paths:
      - "android-native/**"
      - "tools/horizon-revisions.env"
      - "tools/patch_horizon_android_touch.py"
      - "tools/horizon_patches/**"
      - ".github/workflows/horizon-runtime-release.yml"

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      build: ${{ steps.resolve.outputs.build }}
      release_exists: ${{ steps.resolve.outputs.release_exists }}
      upstream_tag: ${{ steps.resolve.outputs.upstream_tag }}
      upstream_commit: ${{ steps.resolve.outputs.upstream_commit }}
      runtime_version: ${{ steps.resolve.outputs.runtime_version }}
      runtime_tag: ${{ steps.resolve.outputs.runtime_tag }}
      overlay_sha: ${{ steps.resolve.outputs.overlay_sha }}
    steps:
      - name: Checkout overlay sources
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref_name }}

      - name: Resolve upstream Horizon release and runtime tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, urllib.error, urllib.parse, urllib.request

          token = os.environ["GH_TOKEN"]
          def get_json(url, allow_404=False):
              request = urllib.request.Request(url, headers={
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "MobileHorizonNative-runtime-release",
                  "Authorization": "Bearer " + token,
              })
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as error:
                  if allow_404 and error.code == 404:
                      return None
                  raise

          import re
          releases = []
          # The newest stable tag is normally on page 1, but rapid prerelease activity can push
          # it beyond the first 100 records. Page until a short page or a bounded safety limit.
          for page in range(1, 11):
              batch = get_json(
                  "https://api.github.com/repos/ludovic111/horizon/releases?per_page=100&page=" + str(page)
              )
              if not isinstance(batch, list):
                  raise SystemExit("Unexpected response while listing Horizon releases.")
              releases.extend(batch)
              if len(batch) < 100:
                  break
          stable = [
              release for release in releases
              if not release.get("draft") and not release.get("prerelease")
              and re.fullmatch(r"v[0-9][A-Za-z0-9._+-]{0,50}", release.get("tag_name", ""))
              and (release.get("published_at") or release.get("created_at"))
          ]
          if not stable:
              raise SystemExit("No published stable Horizon release was found.")
          latest = max(stable, key=lambda item: item.get("published_at") or item.get("created_at", ""))
          upstream_tag = latest["tag_name"]
          encoded_tag = urllib.parse.quote(upstream_tag, safe="")
          ref = get_json("https://api.github.com/repos/ludovic111/horizon/git/ref/tags/" + encoded_tag)
          obj = ref["object"]
          while obj.get("type") == "tag":
              obj = get_json("https://api.github.com/repos/ludovic111/horizon/git/tags/" + obj["sha"])["object"]
          if obj.get("type") != "commit":
              raise SystemExit("Upstream tag did not resolve to a commit: " + upstream_tag)
          upstream_commit = obj["sha"]

          # Hash every tracked build input, not a hard-coded patch list. This includes
          # newly added patch groups and any Android Rust source/config file that affects the
          # native engine; otherwise a complete old release could suppress a required rebuild.
          exact_inputs = {
              b"tools/patch_horizon_android_touch.py",
              b"tools/horizon-revisions.env",
              b".github/workflows/horizon-runtime-release.yml",
          }
          tracked = subprocess.check_output(["git", "ls-files", "-z"], cwd=".", text=False)
          tracked_paths = [entry for entry in tracked.split(b"\0") if entry]
          overlay_paths = sorted(
              entry for entry in tracked_paths
              if entry in exact_inputs
              or entry.startswith(b"android-native/")
              or entry.startswith(b"tools/horizon_patches/")
          )
          if not overlay_paths:
              raise SystemExit("No tracked Android runtime build inputs were found.")
          overlay_digest = hashlib.sha256()
          for raw_path in overlay_paths:
              source_path = pathlib.Path(os.fsdecode(raw_path))
              if not source_path.is_file():
                  raise SystemExit("Missing runtime build input: " + str(source_path))
              overlay_digest.update(raw_path)
              overlay_digest.update(b"\0")
              overlay_digest.update(source_path.read_bytes())
              overlay_digest.update(b"\0")
          overlay_sha = overlay_digest.hexdigest()[:8]
          runtime_version = "horizon-" + upstream_tag + "-c" + upstream_commit[:8] + "-o" + overlay_sha
          runtime_tag = "horizon-runtime-" + runtime_version

          existing = get_json(
              "https://api.github.com/repos/Ph04/MobileHorizonNative/releases/tags/"
              + urllib.parse.quote(runtime_tag, safe=""),
              allow_404=True,
          )
          release_exists = existing is not None
          build = True
          if existing is not None:
              assets = existing.get("assets", [])
              engine_asset = next(
                  (asset for asset in assets
                   if asset.get("name") == "horizon-runtime-arm64-v8a.so"), None
              )
              manifest_asset = next(
                  (asset for asset in assets
                   if asset.get("name") == "horizon-runtime-manifest.json"), None
              )
              try:
                  if engine_asset is None or manifest_asset is None:
                      raise ValueError("the ARM64 engine or runtime manifest is missing")
                  engine_digest = engine_asset.get("digest", "")
                  manifest_digest = manifest_asset.get("digest", "")
                  if (not engine_digest.startswith("sha256:")
                          or not re.fullmatch(r"sha256:[0-9a-fA-F]{64}", engine_digest)
                          or not re.fullmatch(r"sha256:[0-9a-fA-F]{64}", manifest_digest)):
                      raise ValueError("GitHub has not supplied valid SHA-256 asset digests")
                  if (int(engine_asset.get("size", 0)) <= 0
                          or int(engine_asset.get("size", 0)) > 300 * 1024 * 1024
                          or int(manifest_asset.get("size", 0)) <= 0
                          or int(manifest_asset.get("size", 0)) > 64 * 1024):
                      raise ValueError("runtime release asset size is invalid")

                  manifest_url = manifest_asset.get("browser_download_url", "")
                  if not manifest_url.startswith(
                          "https://github.com/Ph04/MobileHorizonNative/releases/download/"):
                      raise ValueError("runtime manifest URL is invalid")
                  request = urllib.request.Request(manifest_url, headers={
                      "User-Agent": "MobileHorizonNative-runtime-release",
                      "Accept": "application/octet-stream",
                  })
                  with urllib.request.urlopen(request, timeout=30) as response:
                      manifest_bytes = response.read(64 * 1024 + 1)
                  if len(manifest_bytes) > 64 * 1024:
                      raise ValueError("runtime manifest is too large")
                  manifest_sha = hashlib.sha256(manifest_bytes).hexdigest()
                  if manifest_sha.lower() != manifest_digest.split(":", 1)[1].lower():
                      raise ValueError("runtime manifest SHA-256 does not match GitHub metadata")
                  manifest = json.loads(manifest_bytes.decode("utf-8"))
                  expected_engine_sha = engine_digest.split(":", 1)[1].lower()
                  if (manifest.get("format") != 1
                          or manifest.get("version") != runtime_version
                          or manifest.get("upstream_tag") != upstream_tag
                          or manifest.get("upstream_commit") != upstream_commit
                          or manifest.get("overlay") != overlay_sha
                          or manifest.get("abi") != "arm64-v8a"
                          or manifest.get("library") != "horizon-runtime-arm64-v8a.so"
                          or str(manifest.get("sha256", "")).lower() != expected_engine_sha):
                      raise ValueError("existing manifest does not match the selected Horizon source/overlay")
                  build = False
              except Exception as error:
                  print("Existing runtime release is incomplete or stale; rebuilding: " + str(error),
                        flush=True)


          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"build={'true' if build else 'false'}\n")
              out.write(f"release_exists={'true' if release_exists else 'false'}\n")
              out.write(f"upstream_tag={upstream_tag}\n")
              out.write(f"upstream_commit={upstream_commit}\n")
              out.write(f"runtime_version={runtime_version}\n")
              out.write(f"runtime_tag={runtime_tag}\n")
              out.write(f"overlay_sha={overlay_sha}\n")

          print("Upstream release:", upstream_tag)
          print("Upstream commit:", upstream_commit)
          print("Runtime version:", runtime_version)
          print("Existing runtime release is verified and complete:", not build)
          print("Runtime build required:", build)
          PY

  build-runtime:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout MobileHorizonNative overlay
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref_name }}

      - name: Set up Rust for Android ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Install Android NDK with retry
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          for attempt in 1 2 3 4; do
            rm -rf "$ANDROID_HOME/temp"
            if "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "ndk;27.2.12479018"; then
              break
            fi
            if [[ "$attempt" == 4 ]]; then
              echo "::error::Android NDK installation failed after $attempt attempts."
              exit 1
            fi
            echo "::warning::Android NDK download failed (attempt $attempt); retrying."
          done
          test -x "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"

      - name: Fetch and patch upstream Horizon source
        id: source
        env:
          UPSTREAM_TAG: ${{ needs.resolve.outputs.upstream_tag }}
          UPSTREAM_COMMIT: ${{ needs.resolve.outputs.upstream_commit }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/horizon-runtime-source"
          git init "$SOURCE"
          git -C "$SOURCE" remote add origin https://github.com/ludovic111/horizon.git
          git -C "$SOURCE" fetch --depth 1 origin "refs/tags/$UPSTREAM_TAG:refs/tags/$UPSTREAM_TAG"
          git -C "$SOURCE" checkout --detach "$UPSTREAM_TAG"
          test "$(git -C "$SOURCE" rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          python3 -m py_compile tools/patch_horizon_android_touch.py tools/horizon_patches/*.py
          python3 tools/patch_horizon_android_touch.py "$SOURCE"
          echo "Prepared $UPSTREAM_TAG ($UPSTREAM_COMMIT) with the Android compatibility overlay."

      - name: Test patched platform-neutral Horizon crates
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/horizon-runtime-source"
          cargo test --manifest-path "$SOURCE/Cargo.toml" -p horizon-mods --lib --no-default-features
          cargo test --manifest-path "$SOURCE/Cargo.toml" -p horizon-protocol --lib --no-default-features
          cargo test --manifest-path "$SOURCE/Cargo.toml" -p horizon-client --lib --no-default-features

      - name: Build Horizon engine for Android ARM64
        env:
          UPSTREAM_COMMIT: ${{ needs.resolve.outputs.upstream_commit }}
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android35-clang"
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android35-clang"
          export CXX_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android35-clang++"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          SOURCE="$RUNNER_TEMP/horizon-runtime-source"
          cargo build --release --no-default-features --manifest-path "$SOURCE/Cargo.toml" -p mobilehorizon-android --target aarch64-linux-android

          LIB="$SOURCE/target/aarch64-linux-android/release/libhorizon_engine.so"
          test -s "$LIB"
          "$TOOLCHAIN/llvm-readelf" -h "$LIB" > "$RUNNER_TEMP/engine-header.txt"
          grep -Fq "AArch64" "$RUNNER_TEMP/engine-header.txt"
          "$TOOLCHAIN/llvm-readelf" -Ws "$LIB" > "$RUNNER_TEMP/engine-symbols.txt"
          grep -Fq "ANativeActivity_onCreate" "$RUNNER_TEMP/engine-symbols.txt"
          grep -Fq "android_main" "$RUNNER_TEMP/engine-symbols.txt"
          grep -Fq "Java_dev_mobilehorizon_app_NativeGameActivity_nativeInjectCursorMove" "$RUNNER_TEMP/engine-symbols.txt"

          RELEASE_DIR="$RUNNER_TEMP/runtime-release"
          mkdir -p "$RELEASE_DIR"
          cp "$LIB" "$RELEASE_DIR/horizon-runtime-arm64-v8a.so"
          ENGINE_SHA256="$(sha256sum "$LIB" | awk '{print $1}')"
          python3 - "$RELEASE_DIR/horizon-runtime-manifest.json" \
            "$UPSTREAM_COMMIT" "${{ needs.resolve.outputs.runtime_version }}" \
            "${{ needs.resolve.outputs.upstream_tag }}" "${{ needs.resolve.outputs.overlay_sha }}" \
            "$ENGINE_SHA256" <<'PYMANIFEST'
          import json, sys
          path, commit, version, upstream_tag, overlay, digest = sys.argv[1:]
          manifest = {
              "format": 1,
              "version": version,
              "upstream_tag": upstream_tag,
              "upstream_commit": commit,
              "overlay": overlay,
              "abi": "arm64-v8a",
              "library": "horizon-runtime-arm64-v8a.so",
              "sha256": digest.lower(),
          }
          with open(path, "w", encoding="utf-8") as stream:
              json.dump(manifest, stream, indent=2)
              stream.write("\n")
          print(f"Runtime manifest: {version}, SHA-256 {digest}")
          PYMANIFEST

      - name: Verify the selected Horizon release is still the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ needs.resolve.outputs.upstream_tag }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request

          request = urllib.request.Request(
              "https://api.github.com/repos/ludovic111/horizon/releases/latest",
              headers={
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "MobileHorizonNative-runtime-release",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              release = json.loads(response.read().decode("utf-8"))
          latest_tag = release.get("tag_name", "")
          selected_tag = os.environ["UPSTREAM_TAG"]
          if (release.get("draft") or release.get("prerelease")
                  or latest_tag != selected_tag):
              raise SystemExit(
                  "Horizon advanced during the Android runtime build: selected "
                  + selected_tag + ", latest stable is " + latest_tag
                  + ". Refusing to publish a stale runtime; the next scheduled/push run will resolve it."
              )
          print("Confirmed upstream stable release is still latest:", latest_tag)
          PY

      - name: Publish versioned Horizon runtime
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_TAG: ${{ needs.resolve.outputs.runtime_tag }}
          RUNTIME_VERSION: ${{ needs.resolve.outputs.runtime_version }}
          RELEASE_EXISTS: ${{ needs.resolve.outputs.release_exists }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="$RUNNER_TEMP/runtime-release"
          NOTES="Android ARM64 Horizon engine built from the upstream stable release and the MobileHorizonNative compatibility overlay. SHA-256 is exposed by the GitHub release asset metadata; install is staged for the next app launch. This release is not an APK."
          if [[ "$RELEASE_EXISTS" == "true" ]]; then
            gh release upload "$RUNTIME_TAG" \
              "$RELEASE_DIR/horizon-runtime-arm64-v8a.so" \
              "$RELEASE_DIR/horizon-runtime-manifest.json" --clobber
          else
            gh release create "$RUNTIME_TAG" \
              "$RELEASE_DIR/horizon-runtime-arm64-v8a.so" \
              "$RELEASE_DIR/horizon-runtime-manifest.json" \
              --title "$RUNTIME_VERSION" --notes "$NOTES"
          fi
          echo "Published Android runtime release $RUNTIME_TAG."
