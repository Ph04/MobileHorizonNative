name: Schedule Horizon runtime publication

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

# This file exists on the GitHub default branch only because scheduled workflows
# are restricted to that branch. The reusable workflow and all build inputs come
# from feature/horizon-runtime-loader, which is the active MobileHorizonNative line.
permissions:
  contents: write

jobs:
  publish-active-branch-runtime:
    name: Publish runtime from feature/horizon-runtime-loader
    uses: Ph04/MobileHorizonNative/.github/workflows/horizon-runtime-release.yml@feature/horizon-runtime-loader
    with:
      source_ref: feature/horizon-runtime-loader
    permissions:
      contents: write
