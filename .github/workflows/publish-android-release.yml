name: Publish MobileHorizonNative Android release

on:
  push:
    branches:
      - feature/horizon-runtime-loader
    paths:
      - .github/workflows/publish-android-release.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: mobilehorizon-android-release-v0.3.24
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: "40445823390"
      SOURCE_SHA: "14edcae430b876261432ff5719a920fce3e28c25"
      RELEASE_TAG: "v0.3.24"
      ARTIFACT_NAME: "mobilehorizon-native-offline1-update-safe"
    steps:
      - name: Verify successful source build and release tag availability
        shell: bash
        run: |
          set -euo pipefail

          RUN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq '.head_sha')"
          RUN_STATUS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq '.status')"
          RUN_CONCLUSION="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq '.conclusion')"
          RUN_BRANCH="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq '.head_branch')"

          [[ "${RUN_SHA}" == "${SOURCE_SHA}" ]] || { echo "::error::Build SHA mismatch: ${RUN_SHA}"; exit 1; }
          [[ "${RUN_STATUS}" == "completed" && "${RUN_CONCLUSION}" == "success" ]] || {
            echo "::error::The source Android workflow did not succeed."
            exit 1
          }
          [[ "${RUN_BRANCH}" == "feature/horizon-runtime-loader" ]] || {
            echo "::error::Unexpected source branch: ${RUN_BRANCH}"
            exit 1
          }

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts" \
            --jq ".artifacts[] | select(.name == \"${ARTIFACT_NAME}\" and .expired == false) | .id" \
            > "${RUNNER_TEMP}/artifact-ids.txt"
          test -s "${RUNNER_TEMP}/artifact-ids.txt" || {
            echo "::error::The signed update-safe APK artifact was not found."
            exit 1
          }

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::Release ${RELEASE_TAG} already exists; refusing to overwrite a published release."
            exit 1
          fi

          echo "Verified successful source build ${SOURCE_RUN_ID} for ${SOURCE_SHA}."

      - name: Download APK from the verified source build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/mobilehorizon-release"
          gh run download "${SOURCE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${ARTIFACT_NAME}" \
            --dir "${RUNNER_TEMP}/mobilehorizon-release"

          mapfile -t APKS < <(find "${RUNNER_TEMP}/mobilehorizon-release" -type f -name '*.apk' -print)
          [[ "${#APKS[@]}" -eq 1 ]] || {
            echo "::error::Expected exactly one APK, found ${#APKS[@]}."
            find "${RUNNER_TEMP}/mobilehorizon-release" -maxdepth 3 -type f -print
            exit 1
          }

          APK_PATH="${APKS[0]}"
          unzip -tq "${APK_PATH}"
          mv "${APK_PATH}" "${RUNNER_TEMP}/mobilehorizon-release/MobileHorizonNative-0.3.24.apk"
          cd "${RUNNER_TEMP}/mobilehorizon-release"
          sha256sum "MobileHorizonNative-0.3.24.apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo "### Verified APK"
            echo
            echo "- Version: 0.3.24 (versionCode 27)"
            echo "- Source commit: ${SOURCE_SHA}"
            echo "- Source workflow: [${SOURCE_RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID})"
            echo "- Artifact: ${ARTIFACT_NAME}"
            echo "- ZIP integrity: passed"
            echo "- SHA-256:"
            echo
            printf '%s\n' '---' 'SHA-256 checksum file:' 
            cat SHA256SUMS.txt
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/release-notes.md" <<'NOTES'
          ## MobileHorizonNative 0.3.24

          Esta versão corrige o menu do botão flutuante e remove o gerenciador de skins local para reduzir conflitos no multiplayer.

          ### Correções
          - O painel do botão flutuante volta a usar um diálogo pertencente à atividade do jogo, preservando as ações anteriores e mantendo o estilo visual atualizado.
          - Removida a integração de skins locais e as substituições de textura/modelo do jogador, restaurando o caminho normal de skins do Horizon/servidor.
          - Mantida a configuração dos controles táteis e as demais funções presentes no build de origem.

          ### APK
          - Android ARM64 (arm64-v8a).
          - Versão Android: 0.3.24 (versionCode 27).
          - Extraído do artefato assinado e verificado do build #956, sem recompilar nem substituir o APK por outra versão.
          - Commit de origem: `14edcae430b876261432ff5719a920fce3e28c25`.
          - Consulte `SHA256SUMS.txt` para verificar a integridade do APK.

          ### Observações
          MobileHorizonNative é um projeto Android independente e não oficial baseado em Horizon. Minecraft e Horizon mantêm seus próprios créditos e licenças; o projeto não é afiliado à Mojang Studios nem à Microsoft.
          NOTES

          gh release create "${RELEASE_TAG}" \
            "${RUNNER_TEMP}/mobilehorizon-release/MobileHorizonNative-0.3.24.apk" \
            "${RUNNER_TEMP}/mobilehorizon-release/SHA256SUMS.txt" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${SOURCE_SHA}" \
            --title "MobileHorizonNative 0.3.24" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"

          RELEASE_URL="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json url --jq '.url')"
          echo "Published: ${RELEASE_URL}" >> "${GITHUB_STEP_SUMMARY}"
