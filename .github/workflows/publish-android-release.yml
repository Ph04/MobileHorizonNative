name: Publish MobileHorizonNative Android release

on:
  push:
    branches:
      - feature/horizon-runtime-loader
    paths:
      - .github/workflows/publish-android-release.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: mobilehorizon-android-release-v0.3.29
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: "40696022773"
      SOURCE_SHA: "f759a85b2dd047feed8a93358b5ae48c8fbbbfe1"
      RELEASE_TARGET_SHA: "dc0c16f80a61dc4a4d5e9fd3f35bc8aefed7ba19"
      RELEASE_TAG: "v0.3.29"
      ARTIFACT_NAME: "mobilehorizon-native-offline1-update-safe"
    steps:
      - name: Verify successful source build and release tag availability
        shell: bash
        run: |
          set -euo pipefail

          RUN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq '.head_sha')"
          RUN_STATUS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq '.status')"
          RUN_CONCLUSION="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq '.conclusion')"
          RUN_BRANCH="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq '.head_branch')"

          [[ "${RUN_SHA}" == "${SOURCE_SHA}" ]] || { echo "::error::Build SHA mismatch: ${RUN_SHA}"; exit 1; }
          [[ "${RUN_STATUS}" == "completed" && "${RUN_CONCLUSION}" == "success" ]] || {
            echo "::error::The source Android workflow did not succeed."
            exit 1
          }
          [[ "${RUN_BRANCH}" == "feature/horizon-runtime-loader" ]] || {
            echo "::error::Unexpected source branch: ${RUN_BRANCH}"
            exit 1
          }

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts" \
            --jq ".artifacts[] | select(.name == \"${ARTIFACT_NAME}\" and .expired == false) | .id" \
            > "${RUNNER_TEMP}/artifact-ids.txt"
          test -s "${RUNNER_TEMP}/artifact-ids.txt" || {
            echo "::error::The signed update-safe APK artifact was not found."
            exit 1
          }

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; the publication step will update its metadata."
          fi

          # Create the tag independently so the release API can bind to this exact commit
          # without asking GITHUB_TOKEN to target a commit that changes workflow files.
          if TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha' 2>/dev/null)"; then
            [[ "${TAG_SHA}" == "${RELEASE_TARGET_SHA}" ]] || {
              echo "::error::Tag ${RELEASE_TAG} already points at unexpected commit ${TAG_SHA}."
              exit 1
            }
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${RELEASE_TAG}" \
              -f "sha=${RELEASE_TARGET_SHA}" >/dev/null
          fi

          echo "Verified successful source build ${SOURCE_RUN_ID} for ${SOURCE_SHA}; release snapshot is ${RELEASE_TARGET_SHA}."

      - name: Download APK from the verified source build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/mobilehorizon-release"
          gh run download "${SOURCE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${ARTIFACT_NAME}" \
            --dir "${RUNNER_TEMP}/mobilehorizon-release"

          mapfile -t APKS < <(find "${RUNNER_TEMP}/mobilehorizon-release" -type f -name '*.apk' -print)
          [[ "${#APKS[@]}" -eq 1 ]] || {
            echo "::error::Expected exactly one APK, found ${#APKS[@]}."
            find "${RUNNER_TEMP}/mobilehorizon-release" -maxdepth 3 -type f -print
            exit 1
          }

          APK_PATH="${APKS[0]}"
          unzip -tq "${APK_PATH}"
          mv "${APK_PATH}" "${RUNNER_TEMP}/mobilehorizon-release/MobileHorizonNative-0.3.29.apk"
          cd "${RUNNER_TEMP}/mobilehorizon-release"
          sha256sum "MobileHorizonNative-0.3.29.apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo "### Verified APK"
            echo
            echo "- Version: 0.3.29 (versionCode 32)"
            echo "- Source commit: ${SOURCE_SHA}"
            echo "- Source workflow: [${SOURCE_RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID})"
            echo "- Artifact: ${ARTIFACT_NAME}"
            echo "- ZIP integrity: passed"
            echo "- SHA-256:"
            echo
            printf '%s\n' '---' 'SHA-256 checksum file:' 
            cat SHA256SUMS.txt
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/release-notes.md" <<'NOTES'
          ## MobileHorizonNative 0.3.29

          Esta versão adiciona a localização da interface do MobileHorizon em Português e English, sem alterar o idioma interno do Minecraft, e inclui o ajuste para girar a câmera enquanto mantém um botão de ação pressionado.

          ### Correções
          - Seletor de idioma Português ↔ English para a interface e os painéis do MobileHorizon; não altera as configurações de idioma do Minecraft.
          - Traduções da tela inicial, gerenciador de recursos, editor de controles e painéis próprios do launcher.
          - É possível manter um botão de ação pressionado e deslizar o mesmo dedo para girar a câmera.
          - Mantidas as funcionalidades existentes no artefato de origem.
          - Verificação de atualizações do runtime a cada cinco minutos e consulta ao repositório oficial `horizon-rust/horizon`, sem exigir uma nova compilação do APK para cada versão do motor.

          ### APK
          - Android ARM64 (arm64-v8a).
          - Versão Android: 0.3.29 (versionCode 32).
          - Extraído do artefato assinado e verificado do workflow run 40696022773, sem recompilar nem substituir o APK por outra versão.
          - Commit de origem: `f759a85b2dd047feed8a93358b5ae48c8fbbbfe1`.
          - Consulte `SHA256SUMS.txt` para verificar a integridade do APK.

          ### Observações
          MobileHorizonNative é um projeto Android independente e não oficial baseado em Horizon. Minecraft e Horizon mantêm seus próprios créditos e licenças; o projeto não é afiliado à Mojang Studios nem à Microsoft.
          NOTES

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "MobileHorizonNative 0.3.29" \
              --notes-file "${RUNNER_TEMP}/release-notes.md"
          else
            gh release create "${RELEASE_TAG}" \
              "${RUNNER_TEMP}/mobilehorizon-release/MobileHorizonNative-0.3.29.apk" \
              "${RUNNER_TEMP}/mobilehorizon-release/SHA256SUMS.txt" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "MobileHorizonNative 0.3.29" \
              --notes-file "${RUNNER_TEMP}/release-notes.md"
          fi

          RELEASE_URL="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json url --jq '.url')"
          echo "Published: ${RELEASE_URL}" >> "${GITHUB_STEP_SUMMARY}"
